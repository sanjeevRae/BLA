<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLA Driver</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --line: #e5e9f0;
        --ink: #0f172a;
        --slate: #64748b;
        --brand: #2563eb;
        --pos: #16a34a;
        --red: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 14px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .topbar h1 { font-size: 16px; margin: 0; }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: #dbeafe;
        color: var(--brand);
      }
      .badge.big { background: #fef3c7; color: #b45309; }
      main { max-width: 640px; margin: 0 auto; padding: 16px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .muted { color: var(--slate); font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      button {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      button.ghost { color: var(--slate); }
      button:disabled { opacity: 0.5; cursor: default; }
      input, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        background: var(--surface);
        color: var(--ink);
      }
      .error { color: var(--red); font-size: 13px; font-weight: 500; margin: 8px 0; }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        background: #f1f5f9;
        color: var(--slate);
        text-transform: uppercase;
      }
      .cod { color: var(--pos); font-weight: 700; }
      #gps.on { background: #dcfce7; border-color: var(--pos); color: var(--pos); }
      .hidden { display: none !important; }
      a { color: var(--brand); font-size: 13px; }
    </style>
  </head>
  <body>
    <!-- Supabase UMD build (same as customer-tracking) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>

    <header class="topbar">
      <h1>BLA Driver</h1>
      <div class="row" style="gap: 10px">
        <span id="role-badge" class="badge hidden">—</span>
        <button id="gps" class="ghost hidden" type="button">GPS off</button>
        <button id="signout" class="ghost hidden" type="button">Sign out</button>
      </div>
    </header>

    <main>
      <!-- Login -->
      <section id="login-view">
        <div class="card">
          <div class="muted">Driver sign in</div>
          <form id="login-form" class="stack" style="margin-top: 10px">
            <input id="email" type="email" placeholder="Email" autocomplete="email" required />
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <p id="login-error" class="error" hidden></p>
            <button type="submit" class="primary">Sign in</button>
          </form>
          <p class="muted" style="margin-bottom: 0">
            Demo driver: driver@bla.test / driver123
          </p>
        </div>
      </section>

      <!-- App -->
      <section id="app-view" class="hidden">
        <p id="who" class="muted">Loading your jobs…</p>
        <div id="content"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
