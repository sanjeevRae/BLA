name: Daily delivery report

# Emails a daily operations summary by hitting the backend's /tasks/daily-report
# endpoint. Runs on GitHub-hosted runners (2,000 free minutes/month).
#
# ALTERNATIVE: Render Cron Jobs (see backend/render.yaml) can run the same job
# inside Render — useful if you'd rather keep scheduling next to the service and
# avoid exposing the endpoint publicly. Use one or the other, not both.

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -X POST \
            "${API_BASE_URL}/tasks/daily-report?to_email=${REPORT_EMAIL}" \
            -H "X-Cron-Token: ${CRON_TOKEN}"
