<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLA Vendor Portal</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --line: #e5e9f0;
        --ink: #0f172a;
        --slate: #64748b;
        --brand: #2563eb;
        --pos: #16a34a;
        --red: #dc2626;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
      .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
      .topbar h1 { font-size: 16px; margin: 0; }
      main { max-width: 720px; margin: 0 auto; padding: 16px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
      .muted { color: var(--slate); font-size: 12px; }
      h2 { font-size: 14px; margin: 0 0 10px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      .span2 { grid-column: span 2; }
      input, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; background: var(--surface); color: var(--ink); }
      button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      button.ghost { color: var(--slate); }
      button:disabled { opacity: 0.5; cursor: default; }
      .error { color: var(--red); font-size: 13px; font-weight: 500; margin: 8px 0; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #f1f5f9; color: var(--slate); text-transform: uppercase; }
      .pill.ok { background: #dcfce7; color: var(--pos); }
      .mono { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; }
      .rowitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
      .rowitem:first-child { border-top: 0; }
      .net { color: var(--pos); font-weight: 700; }
      .hidden { display: none !important; }
      a { color: var(--brand); font-size: 13px; }
      @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>

    <header class="topbar">
      <h1>BLA Vendor Portal</h1>
      <button id="signout" class="ghost hidden" type="button">Sign out</button>
    </header>

    <main>
      <section id="login-view">
        <div class="card">
          <div class="muted">Vendor sign in</div>
          <form id="login-form" class="stack" style="margin-top: 10px">
            <input id="email" type="email" placeholder="Email" autocomplete="email" required />
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <p id="login-error" class="error" hidden></p>
            <button type="submit" class="primary">Sign in</button>
          </form>
          <p style="margin-bottom: 0"><a href="#" id="dev-skip">Continue without login (dev only)</a></p>
        </div>
      </section>

      <section id="app-view" class="hidden">
        <div class="card">
          <h2>Register parcel</h2>
          <form id="register-form" class="grid">
            <input id="r-recipient" placeholder="Recipient name" />
            <input id="r-phone" placeholder="Recipient phone" />
            <input id="r-address" class="span2" placeholder="Destination address *" required />
            <input id="r-weight" type="number" step="0.1" placeholder="Weight (kg)" />
            <input id="r-value" type="number" placeholder="Declared value" />
            <div class="span2" style="display:flex; justify-content:flex-end">
              <button type="submit" class="primary" id="r-submit">Register</button>
            </div>
          </form>
          <p id="msg" class="error" hidden></p>
        </div>

        <div class="card">
          <h2>My parcels</h2>
          <div id="parcels"><p class="muted">Loading…</p></div>
        </div>

        <div class="card">
          <h2>Settlements</h2>
          <div id="settlements"><p class="muted">Loading…</p></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
